syntax = "proto3";

package market.features.v1;

message NamedFeature {
  string name = 1;
  double value = 2;
}

message FeatureEvent {
  string event_id = 1;
  string source_bar_event_id = 2;
  string target_symbol = 3;
  int64 event_time_unix_ms = 4;
  int64 produced_time_unix_ms = 5;
  string feature_version = 6;
  string feature_schema_hash = 7;
  repeated NamedFeature features = 8;
  repeated string source_symbols = 9;
  bool complete_context = 10;
}
