services:
  market-ingestion:
    build: .
    command: ["/opt/arrakis/arrakis-market-stream"]
    environment: ["FINNHUB_API_KEY", "KAFKA_BOOTSTRAP_SERVERS=kafka:9092"]
    depends_on: [kafka-init]
  bar-aggregator:
    build: .
    command: ["/opt/arrakis/bar-aggregator"]
    environment: ["KAFKA_BOOTSTRAP_SERVERS=kafka:9092"]
    depends_on: [kafka-init]
  kafka:
    image: bitnami/kafka:3.8
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]
  kafka-init:
    image: bitnami/kafka:3.8
    depends_on: [kafka]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until kafka-topics.sh --bootstrap-server kafka:9092 --list; do sleep 2; done;
      for topic in market.raw.trades market.bars.1m market.late.trades dead-letter.events;
      do kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 1; done"
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
